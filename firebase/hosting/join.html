<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Join a trip · Trip Manager</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/favicon.png" />
    <style>
      :root {
        --teal: #0f766e;
        --tint: #e6f6f4;
        --text: #1f2937;
        --muted: #6b7280;
        --bg: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --tint: #12302d;
          --text: #f3f4f6;
          --muted: #9ca3af;
          --bg: #111827;
        }
      }
      body {
        margin: 0;
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      main {
        max-width: 420px;
        margin: 0 auto;
        padding: 48px 16px;
        text-align: center;
      }
      img {
        width: 88px;
        height: 88px;
        border-radius: 22px;
      }
      h1 {
        font-size: 22px;
        margin: 20px 0 8px;
      }
      p {
        color: var(--muted);
        line-height: 1.5;
      }
      .code {
        background: var(--tint);
        border-radius: 12px;
        padding: 16px;
        margin: 24px 0;
        font-size: 32px;
        font-weight: 700;
        letter-spacing: 6px;
        color: var(--teal);
      }
      a.button {
        display: block;
        background: var(--teal);
        color: #fff;
        text-decoration: none;
        font-weight: 600;
        padding: 14px;
        border-radius: 24px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon.png" alt="" />
      <h1>You're invited to a trip</h1>
      <p>Open Trip Manager on your Android phone to join and share expenses.</p>
      <div class="code" id="code">——</div>
      <a class="button" id="open" href="tripmanager://join">Open in Trip Manager</a>
      <p>
        If the button doesn't work, open the app, tap <b>Join a trip</b> and enter the Trip ID
        above. Ask your friend for the app if you don't have it yet.
      </p>
    </main>
    <script>
      // Only Trip ID characters are shown, so the page can't be made to show
      // anything else.
      var raw = new URLSearchParams(location.search).get('code') || '';
      var code = raw
        .toUpperCase()
        .replace(/[^A-Z0-9]/g, '')
        .slice(0, 6);
      if (code) {
        document.getElementById('code').textContent = code;
        document.getElementById('open').href = 'tripmanager://join?code=' + code;
      }
    </script>
  </body>
</html>
